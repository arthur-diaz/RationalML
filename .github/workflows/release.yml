name: RationalML release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[test,boosting,excel,mlflow,shap]" build setuptools
      - run: python -m pytest -q
      - run: python -m pip check
      - run: python examples/quickstart.py
      - run: python -m build
      - name: Verify exact tag, metadata, archives and selected license
        run: python tools/check_release.py dist --tag "$RELEASE_TAG" --require-license
        env:
          RELEASE_TAG: ${{ github.ref_name }}
      - run: python -m pip download --only-binary=:all: --dest wheelhouse dist/*.whl
      - run: python tools/check_sdist.py dist
      - run: python tools/check_wheel.py dist --wheelhouse wheelhouse
      - uses: actions/upload-artifact@v7
        with:
          name: validated-distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: validated-distributions
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
