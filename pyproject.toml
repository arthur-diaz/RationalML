[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
license = "Apache-2.0"
license-files = ["LICENSE"]
name = "RationalML"
version = "1.1.0"
description = "Optuna model comparison for prepared classification and regression data with optional leakage-safe preprocessing"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Arthur D."}]
keywords = ["automl", "model-comparison", "optuna", "classification", "regression", "tabular"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.24,<3",
    "pandas>=2,<4",
    "scikit-learn>=1.5,<2",
    "optuna>=4,<6",
    "threadpoolctl>=3.5,<4",
]

[project.optional-dependencies]
boosting = ["lightgbm>=4,<5", "xgboost>=2,<4"]
legacy = ["tqdm>=4"]
excel = ["openpyxl>=3.0.10,<4"]
mlflow = ["mlflow>=3.1,<4"]
shap = ["shap>=0.49.1,<0.50"]
test = ["pytest>=8,<10"]

[project.urls]
Homepage = "https://github.com/arthur-diaz/RationalML"
Source = "https://github.com/arthur-diaz/RationalML"

[tool.setuptools]
py-modules = ["strategy", "sco_mod", "scoring", "report", "metrics", "second_step"]

[tool.setuptools.packages.find]
include = ["rationalml*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
